[project]
name = "agentcompiler"
version = "0.1.0"
description = "Compiler-inspired orchestration of specialized agents through task dependency graphs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "João Pedro de Moraes Madruga" }]
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
benchmark = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
