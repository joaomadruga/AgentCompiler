<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Sequential multi-agents versus AgentCompiler</title><desc id="desc">Illustrative comparison: sequential execution takes 19 simulated seconds. An optimized dependency graph takes 11, including one second of compilation. Open the interactive HTML for the animation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#80efbe"/></marker></defs>
<rect width="1100" height="520" rx="20" fill="#090d15"/>
<g font-family="Arial,sans-serif"><text x="36" y="42" fill="#80efbe" font-size="12" letter-spacing="3">AGENTCOMPILER / EXECUTION ANATOMY</text><text x="36" y="89" fill="#edf4ff" font-size="34" font-weight="bold">Same goal. A smarter execution path.</text><text x="36" y="118" fill="#92a2b9" font-size="14">Compare two documents · identical task costs · simulated execution</text>
<rect x="30" y="145" width="505" height="278" rx="14" fill="#111824" stroke="#263448"/><rect x="555" y="145" width="515" height="278" rx="14" fill="#111824" stroke="#263448"/>
<text x="52" y="181" fill="#edf4ff" font-size="20">Sequential multi-agents</text><text x="580" y="181" fill="#edf4ff" font-size="20">AgentCompiler</text>
<g fill="none" stroke="#61718a" stroke-width="2"><path d="M180 235H215M345 235H380M445 260V285M380 310H345M215 310H180M115 335V363H282V345"/></g>
<g fill="#182233" stroke="#3b4b61"><rect x="50" y="210" width="130" height="50" rx="8"/><rect x="215" y="210" width="130" height="50" rx="8"/><rect x="380" y="210" width="130" height="50" rx="8"/><rect x="380" y="285" width="130" height="50" rx="8"/><rect x="215" y="285" width="130" height="50" rx="8"/><rect x="50" y="285" width="130" height="50" rx="8"/></g>
<g fill="#edf4ff" font-size="12" text-anchor="middle"><text x="115" y="239">Retrieve A · 3s</text><text x="280" y="239">Retrieve B · 5s</text><text x="445" y="232">Retrieve A again</text><text x="445" y="248" fill="#ffbc7b">3s · redundant</text><text x="445" y="314">Summarize A · 2s</text><text x="280" y="314">Summarize B · 2s</text><text x="115" y="307">Format scratch</text><text x="115" y="324" fill="#ffbc7b">1s · unused</text><text x="282" y="388">Compare · 3s</text></g>
<g fill="none" stroke="#80efbe" stroke-width="2" marker-end="url(#arrow)"><path d="M710 240H755M710 330H755M885 240C920 240 915 280 930 280M885 330C920 330 915 290 930 290"/></g>
<g fill="#173026" stroke="#5ab18c"><rect x="580" y="215" width="130" height="50" rx="8"/><rect x="580" y="305" width="130" height="50" rx="8"/><rect x="755" y="215" width="130" height="50" rx="8"/><rect x="755" y="305" width="130" height="50" rx="8"/><rect x="930" y="260" width="115" height="50" rx="8"/></g>
<g fill="#edf4ff" font-size="12" text-anchor="middle"><text x="645" y="244">Retrieve A · 3s</text><text x="645" y="334">Retrieve B · 5s</text><text x="820" y="244">Summarize A · 2s</text><text x="820" y="334">Summarize B · 2s</text><text x="987" y="289">Compare · 3s</text></g>
<text x="580" y="387" fill="#80efbe" font-size="13">Merge reusable work → prune pure work → dispatch</text>
<text x="52" y="459" fill="#ffbc7b" font-size="24" font-weight="bold">19s / 7 tasks</text><text x="580" y="459" fill="#80efbe" font-size="24" font-weight="bold">11s / 5 tasks</text><text x="580" y="482" fill="#92a2b9" font-size="12">Includes 1s compilation. Planning and synthesis excluded.</text><text x="36" y="505" fill="#92a2b9" font-size="12">Illustration, not benchmark evidence. Open the interactive animation for playback, speed controls, and scrubbing.</text>
</g></svg>
